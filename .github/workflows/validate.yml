name: Validate files
on: workflow_dispatch
jobs:
  validate-html-file:
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4

      - name: validate html file
        run: test -f index.html

  validate-js-file:
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4

      - name: validate js file
        run: test -f script.js

  validate-code:
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@V4

      - name: validate js code
        run: node --check script.js